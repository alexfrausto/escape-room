<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<title>MISIÓN IMPOSIBLE // CODEXTEC</title>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#020510" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="MISIÓN IMPOSIBLE" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rubik+Glitch&family=Share+Tech+Mono&display=swap"
			rel="stylesheet"
		/>
		<link rel="apple-touch-icon" href="/favicon.svg" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta
			name="description"
			content="Terminal táctica Misión Imposible para operaciones de escape room"
		/>
		%sveltekit.head%
		<script>
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', () => {
					navigator.serviceWorker.register('/service-worker.js', { scope: '/' }).catch((err) => {
						console.warn('[SW] Registration failed:', err);
					});
				});
			}
		</script>
	</head>
	<body class="bg-[#020510] text-slate-200 antialiased selection:bg-blue-600 selection:text-white">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
