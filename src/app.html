<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<title>ESCAPE ROOM</title>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#000000" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="ESCAPE ROOM" />
		<link rel="apple-touch-icon" href="/favicon.svg" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta
			name="description"
			content="Offline-first tactical verification terminal for physical escape rooms"
		/>
		%sveltekit.head%
		<script>
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', () => {
					navigator.serviceWorker.register('/service-worker.js', { scope: '/' }).catch((err) => {
						console.warn('[SW] Registration failed:', err);
					});
				});
			}
		</script>
	</head>
	<body class="bg-black text-neutral-200 antialiased selection:bg-emerald-500 selection:text-white">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
